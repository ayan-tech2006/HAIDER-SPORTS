<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Products Manager - Haider Sports Admin</title>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Admin Styles -->
  <link rel="stylesheet" href="css/admin.css">

  <style>
    .star-btn {
      color: #d1d5db;
      font-size: 16px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      transition: color 0.15s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .star-btn:hover {
      transform: scale(1.2);
    }
    .star-btn.active {
      color: #f59e0b;
    }

    .inline-edit-input {
      width: 80px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: right;
      background: #fff;
    }
    .inline-edit-input:focus {
      border-color: var(--primary);
      outline: none;
    }

    .bulk-toolbar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 13px;
    }
    .bulk-toolbar.active {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- Admin Shell Layout -->
  <div id="adminLayout">
    <!-- Header Row -->
    <div class="admin-header-row">
      <div>
        <h2 style="font-size: 22px; font-weight: 800; color: var(--heading);">Products Catalog</h2>
        <p style="font-size: 13px; color: #6b7280; margin-top: 2px;">Manage inventory, pricing, variants, and product visibility.</p>
      </div>

      <div style="display: flex; gap: 10px;">
        <a href="product-edit.html" class="btn btn--primary btn--sm" style="display: inline-flex; align-items: center; gap: 6px;">
          <i data-lucide="plus" style="width: 15px; height: 15px;"></i> Add New Product
        </a>
      </div>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="admin-card" style="margin-bottom: 18px;">
      <div class="admin-card__body" style="padding: 14px 18px;">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
          <!-- Search box -->
          <div class="admin-search-wrap" style="flex: 1; min-width: 240px; max-width: 320px;">
            <i data-lucide="search" style="width: 16px; height: 16px;"></i>
            <input type="text" id="prodSearchInput" class="form-control" placeholder="Search product name or slug...">
          </div>

          <!-- Collection Filter -->
          <div style="min-width: 180px;">
            <select id="prodColFilter" class="form-control" style="font-size: 13px; height: 38px;">
              <option value="">All Collections</option>
            </select>
          </div>

          <!-- Stock Filter -->
          <div>
            <select id="prodStockFilter" class="form-control" style="font-size: 13px; height: 38px;">
              <option value="">All Stock Levels</option>
              <option value="in">In Stock (> 5)</option>
              <option value="low">Low Stock (≤ 5)</option>
              <option value="out">Out of Stock (0)</option>
            </select>
          </div>

          <!-- Status Filter -->
          <div>
            <select id="prodStatusFilter" class="form-control" style="font-size: 13px; height: 38px;">
              <option value="">All Statuses</option>
              <option value="active">Active (Visible)</option>
              <option value="hidden">Hidden</option>
              <option value="featured">Featured Only</option>
            </select>
          </div>

          <button type="button" class="btn btn--outline btn--sm" id="resetFiltersBtn" title="Reset all filters" style="display: inline-flex; align-items: center; gap: 6px;">
            <i data-lucide="rotate-ccw" style="width: 14px; height: 14px;"></i> Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Bulk Action Toolbar -->
    <div class="bulk-toolbar" id="bulkToolbar">
      <span style="font-weight: 600; color: #1e40af;"><span id="selectedCount">0</span> items selected</span>
      <div style="margin-left: auto; display: flex; gap: 8px;">
        <button type="button" class="btn btn--outline btn--xs" id="bulkShowBtn" style="display: inline-flex; align-items: center; gap: 5px;">
          <i data-lucide="eye" style="width: 13px; height: 13px;"></i> Set Visible
        </button>
        <button type="button" class="btn btn--outline btn--xs" id="bulkHideBtn" style="display: inline-flex; align-items: center; gap: 5px;">
          <i data-lucide="eye-off" style="width: 13px; height: 13px;"></i> Hide
        </button>
        <button type="button" class="btn btn--danger btn--xs" id="bulkDeleteBtn" style="display: inline-flex; align-items: center; gap: 5px;">
          <i data-lucide="trash-2" style="width: 13px; height: 13px;"></i> Delete Selected
        </button>
      </div>
    </div>

    <!-- Products Data Table Card -->
    <div class="admin-card">
      <div class="admin-table-wrap" style="border: none;">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width: 38px;">
                <input type="checkbox" id="selectAllCheckbox" style="cursor: pointer;">
              </th>
              <th style="width: 60px;">Image</th>
              <th class="sortable" data-sort="name">Product Name <i data-lucide="arrow-up-down" style="width: 11px; height: 11px; opacity: 0.5; vertical-align: middle;"></i></th>
              <th>Collection</th>
              <th class="sortable" data-sort="price" style="text-align: right;">Price (Rs.) <i data-lucide="arrow-up-down" style="width: 11px; height: 11px; opacity: 0.5; vertical-align: middle;"></i></th>
              <th class="sortable" data-sort="stock" style="text-align: center;">Stock <i data-lucide="arrow-up-down" style="width: 11px; height: 11px; opacity: 0.5; vertical-align: middle;"></i></th>
              <th style="text-align: center;">Status</th>
              <th style="text-align: center; width: 40px;" title="Featured on home page">Star</th>
              <th style="text-align: right; width: 120px;">Actions</th>
            </tr>
          </thead>
          <tbody id="productsTbody">
            <tr>
              <td colspan="9" style="text-align: center; padding: 48px; color: #9ca3af;">
                <i data-lucide="loader-2" class="spin-slow" style="width: 26px; height: 26px; margin: 0 auto 10px; display: block;"></i>
                Loading products catalog...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination Row -->
      <div class="admin-card__body" style="padding: 12px 20px; border-top: 1px solid var(--border);">
        <div class="admin-pagination" id="productsPagination"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/products.js"></script>

</body>
</html>
