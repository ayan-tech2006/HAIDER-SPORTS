<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Blog &amp; Cricket Guides - Haider Sports Admin</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Admin Styles -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Admin Shell Layout -->
  <div id="adminLayout">

    <!-- Top Action Bar -->
    <div class="admin-header-row">
      <div>
        <h2 style="font-size: 22px; font-weight: 800; color: var(--heading);">Blog Posts &amp; Guides</h2>
        <p style="font-size: 13px; color: #64748b; margin-top: 2px;">Manage bat maintenance articles, cricket gear guides, and news updates.</p>
      </div>

      <div style="display: flex; gap: 10px; align-items: center;">
        <a href="blog-edit.html" class="btn btn--primary btn--sm">
          <i data-lucide="plus" style="width: 14px; height: 14px;"></i> Write New Article
        </a>
        <a href="../blog.html" target="_blank" class="btn btn--outline btn--sm">
          <i data-lucide="external-link" style="width: 14px; height: 14px;"></i> View Blog
        </a>
      </div>
    </div>

    <!-- Filter & Search Card -->
    <div class="admin-card" style="margin-bottom: 20px;">
      <div class="admin-card__body" style="padding: 16px;">
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px;">
          <!-- Search box -->
          <div>
            <label class="form-label" style="font-size: 12px;">Search Articles</label>
            <div style="position: relative;">
              <i data-lucide="search" style="position: absolute; left: 12px; top: 12px; color: #94a3b8; width: 15px; height: 15px;"></i>
              <input type="text" id="blogSearchInput" class="form-control form-control--sm" placeholder="Search by title, author, or keyword..." style="padding-left: 36px;">
            </div>
          </div>

          <!-- Category filter -->
          <div>
            <label class="form-label" style="font-size: 12px;">Category</label>
            <select id="blogCategoryFilter" class="form-control form-control--sm">
              <option value="all">All Categories</option>
            </select>
          </div>

          <!-- Status filter -->
          <div>
            <label class="form-label" style="font-size: 12px;">Publish Status</label>
            <select id="blogStatusFilter" class="form-control form-control--sm">
              <option value="all">All Articles</option>
              <option value="published">Published</option>
              <option value="draft">Draft / Hidden</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Blog Table Card -->
    <div class="admin-card">
      <div class="admin-card__body" style="padding: 0;">
        <div class="admin-table-wrap">
          <table class="admin-table" id="blogTable">
            <thead>
              <tr>
                <th style="width: 80px;">Cover</th>
                <th>Article Title</th>
                <th>Category</th>
                <th>Author</th>
                <th>Published Date</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="blogTableBody">
              <!-- Injected via blog.js -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/blog.js"></script>

</body>
</html>
